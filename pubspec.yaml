name: prism_browser
description: "Prism Browser - fast, private, beautiful"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

# Каждая зависимость обоснована в docs/DECISIONES.md (размер, старт, лицензия).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Material is decoupled from the framework since Flutter 3.47.
  material_ui: ^1.7.0
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  dynamic_color: ^2.1.0
  intl: ^0.20.3
  go_router: 18.0.2
  flutter_inappwebview: 6.2.0-beta.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device performance measurements (integration_test/, profile mode).
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Phosphor Icons 2.1 (MIT). Vendored: phosphor_flutter is unmaintained
    # and incompatible with Flutter 3.47 (IconData is final).
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
