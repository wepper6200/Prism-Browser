name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only changes don't need a 15-minute build.
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    # Manual runs can build one platform:
    #   gh workflow run build -f platforms=windows
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        options: [all, android, windows]
        default: all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    name: Analyze & unit/widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      # Goldens/showcase are rendered on Windows (font rasterisation differs).
      - run: flutter test --exclude-tags golden,showcase

  android:
    name: Android APK
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.platforms != 'windows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - run: bash scripts/build_android.sh
      - uses: actions/upload-artifact@v5
        with:
          name: prism-browser-android
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.platforms != 'android'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Goldens (Windows font rendering)
        # Rendering can drift slightly between runner images; failures are
        # reported but don't block the build. Diffs are uploaded below.
        continue-on-error: true
        run: flutter test --tags golden
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: golden-failures
          path: test/golden/failures
          if-no-files-found: ignore
      - name: Inno Setup
        shell: pwsh
        # upgrade = install or update: the script needs 6.3+ (x64compatible).
        run: choco upgrade innosetup -y --no-progress
      - name: Build (portable zip + installer with WebView2 bootstrapper)
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Installer -FetchWebView2
      - uses: actions/upload-artifact@v5
        with:
          name: prism-browser-windows
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: prism-browser-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
